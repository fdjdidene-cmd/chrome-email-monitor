<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Monitor - Tableau de Bord</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📧 Email Monitor</h1>
      <p class="subtitle">Surveille tes emails en temps réel</p>
    </header>

    <div class="stats">
      <div class="stat-box">
        <span class="stat-number" id="emailCount">0</span>
        <span class="stat-label">Emails capturés</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="processedCount">0</span>
        <span class="stat-label">Emails traités</span>
      </div>
    </div>

    <div class="section">
      <h2>Actions</h2>
      <button id="clearBtn" class="btn btn-danger">🗑️ Vider les données</button>
      <button id="exportBtn" class="btn btn-primary">💾 Exporter les emails</button>
      <button id="logsBtn" class="btn btn-info">📋 Voir console</button>
    </div>

    <div class="section">
      <h2>Emails Capturés</h2>
      <div id="emailList" class="email-list">
        <p class="empty">Aucun email capturé pour le moment...</p>
      </div>
    </div>

    <footer>
      <p>Extension Email Monitor v1.0</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
